# Tests, types and the build of the library. The docs workflow checks the site.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      # the library's tests and types also import a few files from site/src
      - run: |
          npm ci
          npm ci --prefix site
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The README figures are up to date
        run: |
          npm run readme:art
          git diff --exit-code docs/img
