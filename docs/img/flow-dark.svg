<svg role="img" xmlns="http://www.w3.org/2000/svg" class="cseen" viewBox="0 0 420 262" aria-label="A flowchart that asks whether the user is signed in"><style>.cseen { --c-ink: var(--cn-ink, currentColor); --c-bg: var(--cn-bg, Canvas); --c-accent: var(--cn-accent, #e0553b); --c-faint: var(--cn-faint, color-mix(in oklab, var(--c-ink) 45%, var(--c-bg))); --c-grid: var(--cn-grid, color-mix(in oklab, var(--c-ink) 16%, var(--c-bg))); --c-surface: var(--cn-surface, color-mix(in oklab, var(--c-ink) 5%, var(--c-bg))); --c-term-bg: var(--cn-term-bg, #15171b); --c-term-fg: var(--cn-term-fg, #e8e6df); --c-s1: var(--cn-s1, var(--c-accent)); --c-s2: var(--cn-s2, #3b82c4); --c-s3: var(--cn-s3, #d99a1f); --c-s4: var(--cn-s4, #8a5cc2); --c-s5: var(--cn-s5, #2fa38a); --c-s6: var(--cn-s6, #c4467a); --c-s7: var(--cn-s7, #7a8f2a); --c-s8: var(--cn-s8, #6b7280); --c-warm: var(--cn-warm, #d9822b); --c-cool: var(--cn-cool, #3b82c4); display: block; width: 100%; height: auto; color: var(--c-ink); } @supports (color: oklch(from red l c h)) { .cseen { --c-s2: var(--cn-s2, oklch(from var(--c-accent) l c calc(h + 45))); --c-s3: var(--cn-s3, oklch(from var(--c-accent) l c calc(h + 90))); --c-s4: var(--cn-s4, oklch(from var(--c-accent) l c calc(h + 135))); --c-s5: var(--cn-s5, oklch(from var(--c-accent) l c calc(h + 180))); --c-s6: var(--cn-s6, oklch(from var(--c-accent) l c calc(h + 225))); --c-s7: var(--cn-s7, oklch(from var(--c-accent) l c calc(h + 270))); --c-s8: var(--cn-s8, oklch(from var(--c-accent) l calc(c * 0.25) h)); --c-warm: var(--cn-warm, oklch(from var(--c-accent) l c 60)); --c-cool: var(--cn-cool, oklch(from var(--c-accent) l c 240)); } } .cseen { --c-lo: color-mix(in oklab, var(--c-bg) 84%, var(--c-ink)); --c-hi: var(--c-accent); } .cseen .cn-r-ink { --c: var(--c-ink); } .cseen .cn-r-faint { --c: var(--c-faint); } .cseen .cn-r-accent { --c: var(--c-accent); } .cseen .cn-r-grid { --c: var(--c-grid); } .cseen .cn-r-warm { --c: var(--c-warm); } .cseen .cn-r-cool { --c: var(--c-cool); } .cseen .cn-r-s1 { --c: var(--c-s1); } .cseen .cn-r-s2 { --c: var(--c-s2); } .cseen .cn-r-s3 { --c: var(--c-s3); } .cseen .cn-r-s4 { --c: var(--c-s4); } .cseen .cn-r-s5 { --c: var(--c-s5); } .cseen .cn-r-s6 { --c: var(--c-s6); } .cseen .cn-r-s7 { --c: var(--c-s7); } .cseen .cn-r-s8 { --c: var(--c-s8); } .cseen .sz { fill: none; stroke: var(--c); stroke-width: var(--cn-w, 1.2); stroke-linecap: round; stroke-linejoin: round; } .cseen .cn-f { stroke-width: calc(var(--cn-w, 1.2) * 0.8); } .cseen .cn-dot { fill: var(--c); stroke: none; } .cseen .cn-head { fill: var(--c); stroke: none; } .cseen .cn-t { fill: var(--c); stroke: none; font: 500 7.5px/1 var(--cn-font, ui-monospace, SFMono-Regular, Menlo, monospace); letter-spacing: 0.02em; } .cseen .cn-gl { fill: none; stroke: var(--c-grid); stroke-width: 0.6; } .cseen .cn-gl-line { stroke-linecap: butt; } .cseen .cn-flow { animation: cn-flow var(--cn-flow-t, 1s) linear infinite; } @keyframes cn-flow { to { stroke-dashoffset: calc(var(--cn-flow-p, 6) * -1); } } @media (prefers-reduced-motion: reduce) { .cseen * { transition: none !important; animation: none !important; } }.cseen{--cn-ink:#e6edf3;--cn-bg:#0d1117;--cn-accent:#3ddc97}</style><path class="sz cn-r-ink" style="stroke-width:1.4" d="M185.4 49.9L185.4 73.4L194.4 73.4L194.4 97"/><path class="cn-head cn-r-ink" d="M194.4 97L191.9 91.5L196.9 91.5Z"/><path class="sz cn-r-ink" style="stroke-width:1.4" d="M210.1 159.2L210.1 185.7L280.5 185.7L280.5 212.1"/><path class="cn-head cn-r-ink" d="M280.5 212.1L278 206.6L283 206.6Z"/><path class="sz cn-r-ink" style="stroke-width:1.4" d="M178.7 159.2L178.7 185.7L163.8 185.7L163.8 212.1"/><path class="cn-head cn-r-ink" d="M163.8 212.1L161.3 206.6L166.3 206.6Z"/><path class="sz cn-r-ink" style="stroke-width:1.4" d="M179.5 212.1L179.5 188.6L194.4 188.6L194.4 165"/><path class="cn-head cn-r-ink" d="M194.4 165L196.9 170.5L191.9 170.5Z"/><path class="sz cn-r-ink cn-f" style="fill:color-mix(in oklab,var(--c) 14%,var(--c-bg))" d="M222.1 22